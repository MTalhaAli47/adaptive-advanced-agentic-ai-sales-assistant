<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sales workspace | MetaCrux AI</title>
  <link rel="stylesheet" href="/assets/site.css?v=20261117-4">
  <style>
    .sales-columns{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:18px;margin-top:18px}
    .side-panels{display:grid;align-content:start;gap:16px}.side-panels .panel{padding:16px}
    #handoffs:empty:after{content:'No customers are waiting for a salesperson.';display:block;color:#6b7486;padding:8px 0}
    .handoff-lead{border-left:4px solid #e99a28}.conversation{height:360px;overflow:auto;background:#f8f9fc;border:1px solid #e4e8f0;border-radius:12px;padding:12px}.bubble.salesperson{background:#e9f8ef;border:1px solid #bee6c9}
    .sales-reply{display:flex;gap:10px;margin-top:10px}.sales-reply input{flex:1;min-width:0;padding:12px;border:1px solid #d9dfeb;border-radius:10px;font:inherit}
    @media(max-width:760px){.sales-columns{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">MetaCrux AI</a><nav class="nav"><a href="/">Website</a><a href="/chat">Customer chat</a></nav></header>
  <main class="section">
    <h1>Sales workspace</h1><p class="muted">Review customer conversations and reply when someone asks for a person.</p>
    <div id="stats" class="statrow"></div>
    <div class="sales-columns">
      <aside class="side-panels">
        <section class="panel"><h2>HandOffs</h2><div id="handoffs"></div></section>
        <section class="panel"><h2>Conversations</h2><div id="leads">Loading…</div></section>
      </aside>
      <section class="panel" id="detail"><p class="muted">Select a conversation to review its context and history.</p></section>
    </div>
    <section class="panel" style="margin-top:18px"><h2>Shared product catalogue</h2><div id="products"></div></section>
  </main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=[],selectedId=null;
async function load(){
  const [w,s,p,h]=await Promise.all([
    fetch('/api/v1/sales/workspace').then(r=>r.json()),fetch('/api/v1/dashboard/summary').then(r=>r.json()),
    fetch('/api/v1/products').then(r=>r.json()),fetch('/api/v1/sales/handoffs').then(r=>r.json())
  ]);
  data=w.conversations;
  document.querySelector('#stats').innerHTML=[['Leads',s.leads],['Human handoffs',s.handoffs],['Appointments to confirm',s.appointments_to_confirm],['Orders awaiting approval',s.orders_pending_approval]].map(x=>`<article class="card"><span class="muted">${x[0]}</span><div class="stat">${x[1]}</div></article>`).join('');
  document.querySelector('#handoffs').innerHTML=h.handoffs.map(x=>{const c=x.customer;return `<button class="lead handoff-lead" onclick="showLead('${esc(c.id)}')"><strong>${esc(c.name)}</strong><br><span class="tag">Waiting for you</span><br><small class="muted">${esc(x.last_message||'Customer requested a salesperson')}</small></button>`}).join('');
  document.querySelector('#leads').innerHTML=data.length?data.map(x=>`<button class="lead" onclick="showLead('${esc(x.customer.id)}')"><strong>${esc(x.customer.name)}</strong><br><span class="tag">${esc(x.customer.channel)}</span> <span class="tag">${esc(x.customer.sales_stage)}</span><br><small class="muted">${esc(x.last_message?.content||'No messages yet')}</small></button>`).join(''):'<p class="muted">No conversations yet. Start a customer conversation to see it here.</p>';
  document.querySelector('#products').innerHTML=p.map(x=>`<div class="product"><strong>${esc(x.name)}</strong><span>${x.price==null?'Price on request':esc(x.currency)+' '+Number(x.price).toLocaleString()}</span></div>`).join('');
  if(selectedId){const draft=document.querySelector('#sales-reply input')?.value||'';await showLead(selectedId);const input=document.querySelector('#sales-reply input');if(input)input.value=draft}
}
async function showLead(id){
  selectedId=id;const item=data.find(x=>x.customer.id===id);if(!item)return;
  const c=item.customer,detail=document.querySelector('#detail');
  detail.innerHTML=`<h2>${esc(c.name)}</h2><p><span class="tag">${esc(c.channel)}</span> <span class="tag">${esc(c.sales_stage)}</span> ${c.handoff_requested?'<span class="tag">Waiting for salesperson</span>':''}</p><h3>Customer context</h3><pre style="white-space:pre-wrap">${esc(JSON.stringify(c.context,null,2))}</pre><h3>Next best action</h3><p><strong>${esc(item.next_action.action)}</strong> — ${esc(item.next_action.reason)}</p>${item.next_action.question?`<p>Suggested question: ${esc(item.next_action.question)}</p>`:''}<h3>Conversation</h3><div id="history" class="conversation">Loading…</div>${c.handoff_requested?`<form id="sales-reply" class="sales-reply"><input name="message" aria-label="Reply to customer" placeholder="Write a reply to ${esc(c.name)}…" required maxlength="8000"><button class="button">Send reply</button></form><button class="button" style="margin-top:10px;background:#596579" onclick="resolveHandoff('${esc(c.id)}')">Mark handoff complete</button>`:`<button class="button" onclick="handoff('${esc(c.id)}')">Request salesperson follow-up</button>`}`;
  const history=await fetch(`/api/v1/conversations/${encodeURIComponent(c.id)}`).then(r=>r.json());
  if(selectedId!==id)return;
  document.querySelector('#history').innerHTML=history.messages.map(m=>`<div class="bubble ${m.role==='customer'?'customer':m.role==='salesperson'?'salesperson':'assistant'}"><strong>${m.role==='salesperson'?'Salesperson':m.role==='customer'?esc(c.name):'Assistant'}</strong><br>${esc(m.content)}</div>`).join('')||'<span class="muted">No messages.</span>';
  const form=document.querySelector('#sales-reply');if(form)form.addEventListener('submit',async event=>{event.preventDefault();const input=form.elements.message,button=form.querySelector('button');button.disabled=true;try{const response=await fetch(`/api/v1/sales/${encodeURIComponent(id)}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:input.value.trim()})});if(!response.ok)throw new Error('Reply could not be sent');input.value='';await load()}catch(error){alert(error.message)}finally{button.disabled=false}});
}
async function handoff(id){await fetch(`/api/v1/sales/${encodeURIComponent(id)}/handoff`,{method:'POST'});await load();showLead(id)}
async function resolveHandoff(id){await fetch(`/api/v1/sales/${encodeURIComponent(id)}/handoff/resolve`,{method:'POST'});await load()}
load();setInterval(load,10000);
</script>
</body>
</html>
