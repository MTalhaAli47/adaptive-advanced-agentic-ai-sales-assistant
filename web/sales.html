<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sales workspace | MetaCrux AI</title>
  <link rel="stylesheet" href="/assets/site.css?v=20261117-6">
  <style>
    .sales-columns{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:18px;margin-top:18px}
    .side-panels{display:grid;align-content:start;gap:16px}.side-panels .panel{padding:16px}
    #handoffs:empty:after{content:'No customers are waiting for a salesperson.';display:block;color:#6b7486;padding:8px 0}
    .handoff-lead{border-left:4px solid #e99a28}.conversation{height:360px;overflow:auto;background:#f8f9fc;border:1px solid #e4e8f0;border-radius:12px;padding:12px}.bubble.salesperson{background:#e9f8ef;border:1px solid #bee6c9}
    .sales-reply{display:flex;gap:10px;margin-top:10px}.sales-reply input{flex:1;min-width:0;padding:12px;border:1px solid #d9dfeb;border-radius:10px;font:inherit}
    .context-panel{margin:18px 0 22px;padding:20px;background:linear-gradient(145deg,#f7f9ff,#fff);border:1px solid #e3e9f5;border-radius:18px}.context-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.context-heading h3{margin:0}.context-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.context-card{min-width:0;padding:15px 16px;background:#fff;border:1px solid #e8edf5;border-radius:13px}.context-card.wide{grid-column:1/-1}.context-label{display:block;margin-bottom:7px;color:#69758a;font-size:12px;font-weight:750;letter-spacing:.055em;text-transform:uppercase}.context-value{font-size:15px;line-height:1.55;overflow-wrap:anywhere}.context-chips{display:flex;flex-wrap:wrap;gap:7px}.context-chip{padding:5px 9px;border-radius:999px;background:#eef2fb;color:#33466d;font-size:13px}.context-chip.good{background:#e9f8ef;color:#19613a}.context-chip.warn{background:#fff4df;color:#81540a}.context-empty{color:#778196}.context-debug{margin-top:14px;border-top:1px solid #e5eaf2;padding-top:11px}.context-debug summary{cursor:pointer;color:#647089;font-size:13px}.context-debug pre{max-height:240px;overflow:auto;padding:12px;background:#f4f6fa;border-radius:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.next-action{padding:14px 16px;border-left:4px solid #3159c9;background:#f3f6ff;border-radius:0 12px 12px 0}
    @media(max-width:760px){.sales-columns{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">MetaCrux AI</a><nav class="nav"><a href="/">Website</a><a href="/chat">Customer chat</a><a href="/admin">Orders admin</a></nav></header>
  <main class="section">
    <h1>Sales workspace</h1><p class="muted">Review customer conversations and reply when someone asks for a person.</p>
    <div id="stats" class="statrow"></div>
    <div class="sales-columns">
      <aside class="side-panels">
        <section class="panel"><h2>HandOffs</h2><div id="handoffs"></div></section>
        <section class="panel"><h2>Conversations</h2><div id="leads">Loading…</div></section>
      </aside>
      <section class="panel" id="detail"><p class="muted">Select a conversation to review its context and history.</p></section>
    </div>
    <section class="panel" style="margin-top:18px"><h2>Shared product catalogue</h2><div id="products"></div></section>
  </main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=[],selectedId=null;
async function load(){
  const [w,s,p,h]=await Promise.all([
    fetch('/api/v1/sales/workspace').then(r=>r.json()),fetch('/api/v1/dashboard/summary').then(r=>r.json()),
    fetch('/api/v1/products').then(r=>r.json()),fetch('/api/v1/sales/handoffs').then(r=>r.json())
  ]);
  data=w.conversations;
  document.querySelector('#stats').innerHTML=[['Leads',s.leads],['Human handoffs',s.handoffs],['Appointments to confirm',s.appointments_to_confirm],['Orders awaiting approval',s.orders_pending_approval]].map(x=>`<article class="card"><span class="muted">${x[0]}</span><div class="stat">${x[1]}</div></article>`).join('');
  document.querySelector('#handoffs').innerHTML=h.handoffs.map(x=>{const c=x.customer;return `<button class="lead handoff-lead" onclick="showLead('${esc(c.id)}')"><strong>${esc(c.name)}</strong><br><span class="tag">Waiting for you</span><br><small class="muted">${esc(x.last_message||'Customer requested a salesperson')}</small></button>`}).join('');
  document.querySelector('#leads').innerHTML=data.length?data.map(x=>`<button class="lead" onclick="showLead('${esc(x.customer.id)}')"><strong>${esc(x.customer.name)}</strong><br><span class="tag">${esc(x.customer.channel)}</span> <span class="tag">${esc(x.customer.sales_stage)}</span><br><small class="muted">${esc(x.last_message?.content||'No messages yet')}</small></button>`).join(''):'<p class="muted">No conversations yet. Start a customer conversation to see it here.</p>';
  document.querySelector('#products').innerHTML=p.map(x=>`<div class="product"><strong>${esc(x.name)}</strong><span>${x.price==null?'Price on request':esc(x.currency)+' '+Number(x.price).toLocaleString()}</span></div>`).join('');
  if(selectedId){const draft=document.querySelector('#sales-reply input')?.value||'';await showLead(selectedId);const input=document.querySelector('#sales-reply input');if(input)input.value=draft}
}
async function showLead(id){
  selectedId=id;const item=data.find(x=>x.customer.id===id);if(!item)return;
  const c=item.customer,detail=document.querySelector('#detail');
  detail.innerHTML=`<h2>${esc(c.name)}</h2><p><span class="tag">${esc(c.channel)}</span> <span class="tag">${esc(c.sales_stage.replaceAll('_',' '))}</span> ${c.handoff_requested?'<span class="tag">Waiting for salesperson</span>':''}</p>${renderCustomerContext(c.context||{})}<h3>Next best action</h3><div class="next-action"><strong>${esc(item.next_action.action.replaceAll('_',' '))}</strong><p>${esc(item.next_action.reason)}</p>${item.next_action.question?`<p><strong>Suggested question:</strong> ${esc(item.next_action.question)}</p>`:''}</div><h3>Conversation</h3><div id="history" class="conversation">Loading…</div>${c.handoff_requested?`<form id="sales-reply" class="sales-reply"><input name="message" aria-label="Reply to customer" placeholder="Write a reply to ${esc(c.name)}…" required maxlength="8000"><button class="button">Send reply</button></form><button class="button" style="margin-top:10px;background:#596579" onclick="resolveHandoff('${esc(c.id)}')">Mark handoff complete</button>`:`<button class="button" onclick="handoff('${esc(c.id)}')">Request salesperson follow-up</button>`}`;
  const history=await fetch(`/api/v1/conversations/${encodeURIComponent(c.id)}`).then(r=>r.json());
  if(selectedId!==id)return;
  document.querySelector('#history').innerHTML=history.messages.map(m=>`<div class="bubble ${m.role==='customer'?'customer':m.role==='salesperson'?'salesperson':'assistant'}"><strong>${m.role==='salesperson'?'Salesperson':m.role==='customer'?esc(c.name):'Assistant'}</strong><br>${esc(m.content)}</div>`).join('')||'<span class="muted">No messages.</span>';
  const form=document.querySelector('#sales-reply');if(form)form.addEventListener('submit',async event=>{event.preventDefault();const input=form.elements.message,button=form.querySelector('button');button.disabled=true;try{const response=await fetch(`/api/v1/sales/${encodeURIComponent(id)}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:input.value.trim()})});if(!response.ok)throw new Error('Reply could not be sent');input.value='';await load()}catch(error){alert(error.message)}finally{button.disabled=false}});
}
function humanize(value){return String(value??'').replaceAll('_',' ').replace(/\b\w/g,char=>char.toUpperCase())}
function moneyContext(value){return value==null?'':`PKR ${Number(value).toLocaleString()}`}
function contextCard(label,value,wide=false){return `<article class="context-card${wide?' wide':''}"><span class="context-label">${esc(label)}</span><div class="context-value">${value||'<span class="context-empty">Not provided</span>'}</div></article>`}
function renderCustomerContext(c){
  const budget=c.budget_max_pkr!=null?(c.budget_min_pkr!=null?`${moneyContext(c.budget_min_pkr)} – ${moneyContext(c.budget_max_pkr)}`:`Up to ${moneyContext(c.budget_max_pkr)}`):(c.budget_flexible?'No fixed budget':c.budget_text?esc(c.budget_text):'');
  const preferences=[];
  if(c.gpu_model)preferences.push(c.gpu_model);if(c.minimum_ram_gb)preferences.push(`${c.minimum_ram_gb} GB RAM minimum`);if(c.minimum_vram_gb)preferences.push(`${c.minimum_vram_gb} GB VRAM minimum`);if(c.urgency)preferences.push(`Urgency: ${humanize(c.urgency)}`);if(c.timeline)preferences.push(`Timing: ${c.timeline}`);
  const order=c.last_order_id?`<div><strong>${esc(humanize(c.last_order_status||'Order requested'))}</strong>${c.last_order_fulfillment_status?` · ${esc(humanize(c.last_order_fulfillment_status))}`:''}${c.last_order_payment_status?` · ${esc(humanize(c.last_order_payment_status))}`:''}</div><small class="context-empty">Reference ${esc(c.last_order_id.slice(0,8))}</small>`:'';
  const appointment=c.pending_appointment?`<span class="context-chip warn">Needs scheduling</span>${c.appointment_requested_time?`<div style="margin-top:7px">${esc(c.appointment_requested_time)}</div>`:''}`:c.last_appointment_status?`<span class="context-chip">${esc(humanize(c.last_appointment_status))}</span>${c.appointment_requested_time?`<div style="margin-top:7px">${esc(c.appointment_requested_time)}</div>`:''}`:'';
  const handoff=c.handoff_requested?`<span class="context-chip warn">Waiting for salesperson</span>${c.handoff_reason?`<div style="margin-top:7px">${esc(c.handoff_reason)}</div>`:''}`:c.handoff_resolved_at?'<span class="context-chip">Completed</span>':c.handoff_reason?`<span class="context-chip good">Follow-up requested</span><div style="margin-top:7px">${esc(c.handoff_reason)}</div>`:'';
  const chips=preferences.map(x=>`<span class="context-chip">${esc(x)}</span>`).join('');
  const hasContext=Boolean(c.need||c.product_category||c.use_case||budget||preferences.length||order||appointment||handoff);
  return `<section class="context-panel"><div class="context-heading"><h3>Customer context</h3><span class="tag">${hasContext?'Captured from conversation':'No details captured yet'}</span></div><div class="context-grid">${contextCard('What they need',c.need?esc(c.need):c.last_customer_message?esc(c.last_customer_message):'')} ${contextCard('Product interest',c.product_category?`<span class="context-chip">${esc(humanize(c.product_category))}</span>`:'')} ${contextCard('Intended use',c.use_case?esc(humanize(c.use_case)):'')} ${contextCard('Budget',budget?esc(budget):'')}${preferences.length?contextCard('Preferences & timing',`<div class="context-chips">${chips}</div>`,true):''}${order?contextCard('Latest order',order,true):''}${appointment?contextCard('Appointment',appointment):''}${handoff?contextCard('Sales follow-up',handoff):''}</div><details class="context-debug"><summary>View technical context</summary><pre>${esc(JSON.stringify(c,null,2))}</pre></details></section>`
}
async function handoff(id){await fetch(`/api/v1/sales/${encodeURIComponent(id)}/handoff`,{method:'POST'});await load();showLead(id)}
async function resolveHandoff(id){await fetch(`/api/v1/sales/${encodeURIComponent(id)}/handoff/resolve`,{method:'POST'});await load()}
load();setInterval(load,10000);
</script>
</body>
</html>
