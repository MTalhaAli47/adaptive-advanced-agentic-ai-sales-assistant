<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales workspace | MetaCrux AI</title><link rel="stylesheet" href="/assets/site.css"></head><body><header class="top"><a class="brand" href="/">MetaCrux AI</a><nav class="nav"><a href="/">Website</a><a href="/chat">Customer chat</a></nav></header><main class="section"><h1>Sales workspace</h1><p class="muted">One view of leads, conversation context, and the next suggested action.</p><div id="stats" class="statrow"></div><div class="grid" style="padding-left:0;padding-right:0"><section class="panel"><h2>Conversations</h2><div id="leads">Loading…</div></section><section class="panel" id="detail"><p class="muted">Select a conversation to review its context and history.</p></section></div><section class="panel"><h2>Shared product catalogue</h2><div id="products"></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[];
async function load(){let [w,s,p]=await Promise.all([fetch('/api/v1/sales/workspace').then(r=>r.json()),fetch('/api/v1/dashboard/summary').then(r=>r.json()),fetch('/api/v1/products').then(r=>r.json())]);data=w.conversations;document.querySelector('#stats').innerHTML=[['Leads',s.leads],['Human handoffs',s.handoffs],['Appointments to confirm',s.appointments_to_confirm],['Orders awaiting approval',s.orders_pending_approval]].map(x=>`<article class="card"><span class="muted">${x[0]}</span><div class="stat">${x[1]}</div></article>`).join('');document.querySelector('#leads').innerHTML=data.length?data.map((x,i)=>`<button class="lead" onclick="showLead(${i})"><strong>${esc(x.customer.name)}</strong><br><span class="tag">${esc(x.customer.channel)}</span> <span class="tag">${esc(x.customer.sales_stage)}</span><br><small class="muted">${esc(x.last_message?.content||'No messages yet')}</small></button>`).join(''):'<p class="muted">No leads yet. Start a customer conversation to see it here.</p>';document.querySelector('#products').innerHTML=p.map(x=>`<div class="product"><strong>${esc(x.name)}</strong><span>${x.price==null?'Price on request':esc(x.currency)+' '+Number(x.price).toLocaleString()}</span></div>`).join('')}
function showLead(i){let x=data[i],c=x.customer;document.querySelector('#detail').innerHTML=`<h2>${esc(c.name)}</h2><p><span class="tag">${esc(c.channel)}</span> <span class="tag">${esc(c.sales_stage)}</span> ${c.handoff_requested?'<span class="tag">Needs human follow-up</span>':''}</p><h3>Customer context</h3><pre style="white-space:pre-wrap">${esc(JSON.stringify(c.context,null,2))}</pre><h3>Next best action</h3><p><strong>${esc(x.next_action.action)}</strong> — ${esc(x.next_action.reason)}</p>${x.next_action.question?`<p>Suggested question: ${esc(x.next_action.question)}</p>`:''}<h3>Conversation</h3><div id="history" class="chat-box" style="height:300px">Loading…</div><button class="button" onclick="handoff('${esc(c.id)}')">Request salesperson follow-up</button>`;fetch(`/api/v1/conversations/${encodeURIComponent(c.id)}`).then(r=>r.json()).then(h=>{document.querySelector('#history').innerHTML=h.messages.map(m=>`<div class="bubble ${m.role==='customer'?'customer':'assistant'}">${esc(m.content)}</div>`).join('')||'<span class="muted">No messages.</span>'})}
async function handoff(id){await fetch(`/api/v1/sales/${encodeURIComponent(id)}/handoff`,{method:'POST'});await load();alert('Follow-up flagged for the sales team.')};load();
</script></body></html>
